name: ATLAS Quality Gate

on:
  pull_request:
  push:
    branches:
      - production/atlas-foundation-v1
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Run architecture, security, tests, types and production build
        run: npm run check
