s="btn" href="#/passport">Ouvrir Passport</a></aside><section class="conversation"><div class="messages" id="messages"><div class="msg">Je suis ATLAS, une interface d’aide à la clarification. Je ne pose pas de diagnostic. Décrivez la situation ; nous allons distinguer les faits, les interprétations, ce que vous ressentez et ce qui peut être fait maintenant.</div>${state.messages.map(m=>`<div class="msg ${m.role}">${m.text}</div>`).join('')}</div><div class="session-compose"><textarea id="sessionInput" placeholder="Décrivez un fait concret, une émotion, une question ou une décision ouverte."></textarea><div><button class="btn" data-voice="sessionInput">Parler</button><button class="btn" id="clearSession">Effacer</button><button class="btn solid" id="send">Envoyer ↗</button></div></div></section><aside class="side"><span class="eyebrow">SATELLITE</span><div class="orbital"><i></i><span>Faits</span><span>Émotion</span><span>Besoin</span><span>Action</span></div><div class="signal"><b>Prochain pas</b><p id="nextStep">Décrire un exemple précis et vérifiable.</p></div><div class="signal"><b>Provenance</b><p>Déclaré par vous · estimations à confirmer.</p></div></aside></div></div></section>`}function passport(){return`<section class="shell page">${routeHero('ATLAS PASSPORT','Votre continuité.','Sous votre contrôle.','Cet espace local conserve uniquement les éléments que vous choisissez sur cet appareil. Aucun compte serveur réel n’est simulé dans cette version.') }<div class="passport"><aside><a class="on">Vue d’ensemble</a><a>Sessions</a><a>Décisions</a><a>Documents</a><a>Consentements</a><a>Export / suppression</a></aside><main><div class="dash"><article class="card"><small>REPRENDRE</small><h3>Session de clarté</h3><p>${state.messages.length} message(s) conservé(s) localement.</p><a class="btn" href="#/session">Continuer ↗</a></article><article class="card"><small>MÉMOIRE</small><h3>Stockage local</h3><p>Les données restent dans ce navigateur jusqu’à leur suppression.</p><button class="btn" id="export">Exporter</button></article><article class="card"><small>CONTRÔLE</small><h3>Effacement immédiat</h3><p>Supprime toutes les données ATLAS enregistrées sur cet appareil.</p><button class="btn" id="erase">Tout supprimer</button></article></div></main></div>${footer()}</section>`}function render(){let r=(location.hash.replace('#/','')||'home').split('?')[0];if(r==='session')app.innerHTML=session();else if(r==='passport'||r==='dashboard')app.innerHTML=passport();else app.innerHTML=(pages[r]?routePage(r):home());document.body.dataset.route=r;$$('[data-n]').forEach(a=>a.classList.toggle('on',a.dataset.n===r));window.scrollTo(0,0);bind()}function routePage(r){return`<section class="shell page">${pages[r]()}</section>`}function bind(){$$('[data-intent]').forEach(b=>b.onclick=()=>{state.intent=b.dataset.intent;save();render()});$('#start')&&($('#start').onclick=()=>{let v=$('#homeInput').value.trim();if(v)state.messages.push({role:'user',text:v});save();location.hash='#/session'});$('#listen')&&($('#listen').onclick=()=>speak('ATLAS est prêt. Décrivez ce qui vous occupe, puis nous organiserons les faits, les émotions et la prochaine action.'));$$('[data-voice]').forEach(b=>b.onclick=()=>voice(b.dataset.voice));$$('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();render()});$('#send')&&($('#send').onclick=send);$('#clearSession')&&($('#clearSession').onclick=()=>{state.messages=[];save();render()});$('#sessionCalm')&&($('#sessionCalm').onclick=()=>document.body.classList.toggle('calm'));$('#export')&&($('#export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='atlas-passport.json';a.click();URL.revokeObjectURL(a.href)});$('#erase')&&($('#erase').onclick=()=>{localStorage.removeItem('atlas_state');state={intent:'Je traverse quelque chose',mode:'clarity',notes:[],messages:[]};toast('Données locales supprimées');render()})}function send(){let i=$('#sessionInput'),t=i.value.trim();if(!t)return;state.messages.push({role:'user',text:t});let lower=t.toLowerCase(),reply=lower.includes('travail')?'Je repère un sujet professionnel. Séparons le fait observable, ce que vous supposez de l’intention de l’autre, et le résultat minimal que vous voulez obtenir.':lower.includes('peur')||lower.includes('angoiss')?'La peur est présente dans vos mots. Ce n’est pas un diagnostic. Quel élément concret doit être sécurisé dans les prochaines heures ?':lower.includes('colère')?'La colère peut signaler une limite ou une injustice. Quel fait précis a franchi votre limite, et quelle réponse resterait tenable ?':'Voici une première structure : un fait à confirmer, une émotion déclarée, un besoin possible et une prochaine action. Quel exemple concret résume le mieux la situation ?';state.messages.push({role:'',text:reply});save();render();setTimeout(()=>{let m=$('#messages');if(m)m.scrollTop=m.scrollHeight},30)}function speak(t){if(!('speechSynthesis'in window))return toast('Lecture vocale non disponible');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.92;speechSynthesis.speak(u)}function voice(id){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Reconnaissance vocale non disponible');let r=new R;r.lang='fr-FR';r.interimResults=false;r.onresult=e=>{let el=document.getElementById(id);el.value=(el.value+' '+e.results[0][0].transcript).trim()};r.onerror=()=>toast('Microphone indisponible');r.start();toast('Écoute en cours…')}$('#calm').onclick=()=>document.body.classList.toggle('calm');$('#menu').onclick=()=>{let r=prompt('Ouvrir : accueil, pour vous, parcours, outils, ressources, confiance, organisations, tarifs, session');if(r){let m={'accueil':'home','pour vous':'foryou','parcours':'paths','outils':'tools','ressources':'resources','confiance':'trust','organisations':'organizations','tarifs':'pricing','session':'session'};location.hash='#/'+(m[r.toLowerCase()]||'home')}};window.addEventListener('hashchange',render);render();const c=$('#field'),x=c.getContext('2d');let pts=[];function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);pts=Array.from({length:Math.min(46,Math.floor(innerWidth/30))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12}))}function draw(){x.clearRect(0,0,innerWidth,innerHeight);for(let p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>innerWidth)p.vx*=-1;if(p.y<0||p.y>innerHeight)p.vy*=-1;x.fillStyle='rgba(141,126,174,.28)';x.beginPath();x.arc(p.x,p.y,1.5,0,7);x.fill()}for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){let a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<145){x.strokeStyle=`rgba(141,126,174,${.09*(1-d/145)})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}requestAnimationFrame(draw)}addEventListener('resize',size);size();draw();</script></body></html>
