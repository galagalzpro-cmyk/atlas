<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS — Activation</title><style>html,body{margin:0;min-height:100%;background:#f3eee5;color:#1d1c24;font-family:system-ui,sans-serif}body{display:grid;place-items:center}main{text-align:center}i{display:block;width:42px;height:42px;margin:0 auto 22px;border:1px solid #7d6ab6;border-top-color:transparent;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{letter-spacing:.12em;text-transform:uppercase;font-size:11px}</style></head><body><main><i></i><p>Activation de l’infrastructure ATLAS</p></main><script>(async()=>{try{const names=['part1.txt','part2.txt','part3.txt','part4.txt','part5.txt','part6.txt','part7.txt','part8.txt'];const b64=(await Promise.all(names.map(n=>fetch(n).then(r=>r.text())))).join('');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main><h1>ATLAS</h1><p>Impossible d’ouvrir cette version sur ce navigateur.</p></main>';console.error(e)}})();</script></body></html>
