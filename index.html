<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ATLAS — Sovereign Field V6</title><meta name="description" content="ATLAS Sovereign Field V6, infrastructure cognitive vivante."><style>html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 38%,#fff,#eee8f3 58%,#e6dfdf);color:#1b1b24;font-family:system-ui,sans-serif}body{display:grid;place-items:center}main{text-align:center;letter-spacing:.08em}i{display:block;width:46px;height:46px;margin:0 auto 24px;border:1px solid rgba(96,77,143,.35);border-top-color:#6f5bb3;border-radius:50%;animation:r 1.2s linear infinite}p{font-size:11px;text-transform:uppercase;color:#6e6977}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><main><i></i><p>Déploiement du champ souverain</p></main><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('unsupported');const urls=Array.from({length:6},(_,i)=>`/parts/${i}.txt`);const pieces=await Promise.all(urls.map(u=>fetch(u,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('segment');return r.text()})));const s=pieces.join('').replace(/\s/g,'');const a=atob(s),u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=a.charCodeAt(i);const stream=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main><h1>ATLAS</h1><p>Le champ n’a pas pu être initialisé. Rechargez la page avec un navigateur récent.</p></main>'}})();</script></body></html>
